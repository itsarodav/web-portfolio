<section data-anim="contact" class="contact-section relative flex flex-col items-center gap-8 overflow-hidden rounded-3xl border border-white/[0.06] bg-zinc-950 p-8 dark:border-zinc-800 dark:bg-zinc-900 md:p-14">
    <!-- Gradient blobs for depth -->
    <div class="pointer-events-none absolute -top-32 -right-32 h-72 w-72 rounded-full bg-brand-1/[0.08] blur-[80px]" aria-hidden="true"></div>
    <div class="pointer-events-none absolute -bottom-32 -left-32 h-72 w-72 rounded-full bg-brand-2/[0.12] blur-[80px]" aria-hidden="true"></div>

    <div class="relative z-10 flex flex-col items-center gap-3">
        <h2 class="text-2xl text-center font-semibold tracking-tight text-white md:text-3xl" data-i18n="contact.title">Let's team up!</h2>
        <p class="max-w-md text-base text-center text-balance text-zinc-400" data-i18n="contact.desc">If you want a design &#x2194; dev partner who cares about craft and delivery, we'll work great together. Open to roles and projects. Say hello :)</p>
    </div>

    <!-- Button with animated gradient border -->
    <div class="relative z-10 flex flex-col items-center">
        <span data-copy-feedback
              class="pointer-events-none absolute -top-5 left-1/2 z-20 -translate-x-1/2 whitespace-nowrap rounded-full bg-brand-1 px-3 py-1 text-xs font-medium text-white opacity-0 shadow-sm"
              aria-live="polite"></span>
        <div class="copy-btn-wrap rounded-full p-px">
            <button
                type="button"
                data-copy-email
                data-copy-text="hi@arodav.com"
                aria-label="Copy email address"
                class="copy-btn group relative inline-flex w-full items-center justify-center gap-3 rounded-full cursor-pointer bg-white px-5 py-3.5 text-lg font-semibold text-zinc-900 transition-colors duration-200 active:scale-[0.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-1/60 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 sm:w-auto sm:min-w-88 sm:text-xl">
                <span class="transition-colors duration-200 group-hover:text-brand-2">hi@arodav.com</span>
                <svg viewBox="0 0 24 24" aria-hidden="true" class="h-5 w-5 shrink-0 fill-current text-brand-1 opacity-80 transition-all duration-200 group-hover:text-brand-2 group-hover:opacity-100 group-hover:-rotate-6">
                    <path d="M14 8C15.103 8 16 8.897 16 10V20C16 21.103 15.103 22 14 22H4C2.897 22 2 21.103 2 20V10C2 8.897 2.897 8 4 8H14Z"/>
                    <path d="M20 2C20.5304 2 21.039 2.21087 21.4141 2.58594C21.7891 2.96101 22 3.46957 22 4V14C22 14.5304 21.7891 15.039 21.4141 15.4141C21.039 15.7891 20.5304 16 20 16H18V8C18 7.46957 17.7891 6.96101 17.4141 6.58594C17.039 6.21086 16.5304 6 16 6H8V4C8 3.46957 8.21086 2.96101 8.58594 2.58594C8.96101 2.21086 9.46957 2 10 2H20Z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Social links as tag pills -->
    <ul data-anim="social-links" class="relative z-10 flex flex-wrap justify-center gap-2.5">
        <li><a class="social-tag" href="https://github.com/itsarodav"
        target="_blank"
        rel="noopener noreferrer">Github</a></li>
        <li><a class="social-tag" href="https://www.linkedin.com/in/arodav/"
        target="_blank"
        rel="noopener noreferrer">Linkedin</a></li>
        <li><a class="social-tag" href="https://www.behance.net/arodav#"
        target="_blank"
        rel="noopener noreferrer">Behance</a></li>
    </ul>
</section>
